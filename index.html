<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리가족</title>
<meta name="theme-color" content="#FFF1BF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리가족">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 버터색 바탕 위에 둥근 카드. 개인 화면은 탭 하나에 화면 하나, 공용 태블릿은 가로 12칸 대시보드. */
:root{
  --bg:#FFF1BF; --surface:#FFFCF1; --sunk:#FBE7A2; --ink:#3A2A1C; --muted:#84704F; --line:#EFD98F;
  --accent:#DD5530; --on-accent:#FFFFFF; --ok:#2F8F56;
  --mom:#F4A3B8; --dad:#8FBBEA; --eun:#F6C23C; --yeon:#8ED4A9; --star:#F2B21B; --star-bg:#F7E3A6;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#231B12; --surface:#30261B; --sunk:#3D3122; --ink:#F9EDD0; --muted:#BDA783; --line:#4D3F2C;
  --accent:#FF8B5E; --on-accent:#2A1508; --ok:#7FD29B;
  --mom:#B9647B; --dad:#4F7FB3; --eun:#B98A14; --yeon:#3F8F63; --star:#F2B21B; --star-bg:#4A3B22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231B12; --surface:#30261B; --sunk:#3D3122; --ink:#F9EDD0; --muted:#BDA783; --line:#4D3F2C;
  --accent:#FF8B5E; --on-accent:#2A1508; --ok:#7FD29B;
  --mom:#B9647B; --dad:#4F7FB3; --eun:#B98A14; --yeon:#3F8F63; --star:#F2B21B; --star-bg:#4A3B22; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
img{max-width:100%} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1360px}
h1,h2,h3,p{margin:0}
h1,h2,h3,.d{font-family:var(--display);font-weight:400;text-wrap:balance}
h3{font-size:22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}

.card{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dash{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.dash>*{grid-column:span 12}
@media (min-width:900px){.dash>.s6{grid-column:span 6}}
/* 공용 태블릿 가로 화면: 스크롤 없이 한 화면에 맞춤 */
@media (min-width:900px) and (orientation:landscape) and (min-height:520px){
  .fitpage,.fitpage body{height:100%}
  .fitpage .wrap{height:100%;padding-block:12px;gap:12px}
  .fitpage .dash{flex:1;min-height:0;gap:12px;grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto}
  .fitpage .dash>.card{min-height:0;overflow:auto;padding:14px;gap:8px}
  .fitpage .dash>.k1{grid-column:1/4;grid-row:1}
  .fitpage .dash>.k2{grid-column:1/4;grid-row:2}
  .fitpage .dash>.c2{grid-column:4/7;grid-row:1/3}
  .fitpage .dash>.c3{grid-column:7/10;grid-row:1}
  .fitpage .dash>.c5{grid-column:7/10;grid-row:2}
  .fitpage .dash>.c4a{grid-column:10/13;grid-row:1}
  .fitpage .dash>.c4b{grid-column:10/13;grid-row:2}
  .fitpage .dash>.c6{grid-column:1/13;grid-row:3;overflow:visible}
  .fitpage .av.lg{width:60px;height:60px;font-size:34px}
  .fitpage .task,.fitpage .ev{padding:8px 12px}
  .fitpage .task .t,.fitpage .ev .t{font-size:17px}
  .fitpage .cal{flex:1;min-height:0;grid-template-rows:auto;grid-auto-rows:minmax(0,1fr)}
  .fitpage .day{aspect-ratio:auto;border-radius:10px;gap:1px;font-size:14px}
  .fitpage .tab{padding:6px 2px}
  .fitpage .clock{font-size:26px;padding:4px 20px}
}

.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.av.lg{width:96px;height:96px;font-size:54px}
.av.sm{width:30px;height:30px;font-size:17px}
.mom{background:var(--mom)}.dad{background:var(--dad)}.eun{background:var(--eun)}.yeon{background:var(--yeon)}.all,.tablet{background:var(--sunk)}

.btn{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:10px 18px;font-family:var(--display);font-size:17px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.admin{background:var(--accent);color:var(--on-accent)}
.notice{background:var(--sunk);border-radius:14px;padding:10px 14px;font-size:14px}

.top h1{font-size:30px;color:var(--accent)}
.me{background:var(--surface);border-radius:999px;padding:6px 16px 6px 6px;display:flex;align-items:center;gap:10px}
.me b{font-family:var(--display);font-weight:400;font-size:18px}
.clock{background:var(--surface);border-radius:999px;padding:8px 26px;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--surface);border-radius:999px;padding:6px}
.tab{border-radius:999px;padding:10px 2px;font-family:var(--display);font-size:17px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

.who{text-align:center;padding-block:24px;gap:26px;align-items:center}
.who h1{font-size:44px;color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;width:100%;max-width:680px}
.person{background:var(--surface);border-radius:var(--r);padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.person .d{font-size:26px}
.person.wideb{flex-direction:row;justify-content:center;width:100%;max-width:680px;padding:18px}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:64px;border-radius:20px;background:var(--surface);font-family:var(--display);font-size:26px}

.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}

.task{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px;width:100%;text-align:left;min-width:0}
.task .box{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-size:16px;color:transparent}
.task.done .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .t{font-family:var(--display);font-size:19px;overflow-wrap:anywhere}
.task[disabled]{cursor:default;opacity:.75}
.x{width:32px;height:32px;border-radius:50%;background:var(--sunk);color:var(--muted);flex:none;font-size:15px}
.taskrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.taskrow>.task{flex:1 1 180px;width:auto}
.tacts{display:flex;gap:8px;flex:none;align-items:center}
.taskrow>.open{margin-left:auto}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:500}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day .pips{display:flex;gap:2px;height:6px}
.day .pips i{width:6px;height:6px;border-radius:50%}
.ev{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px}
.ev .t{font-family:var(--display);font-size:19px;overflow-wrap:anywhere}

form.add{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));align-items:center}
form.add input,form.add select{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;width:100%}
form.add label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
form.add label.check{flex-direction:row;align-items:center;gap:8px;font-size:16px;color:var(--ink);padding-bottom:10px;white-space:nowrap;flex:none}
form.add input[type="checkbox"]{width:24px;height:24px;padding:0;border:0;accent-color:var(--accent);flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.week button{display:flex;flex-direction:column;gap:2px;align-items:stretch;border-radius:10px;padding:2px}
.week b{border-radius:8px;background:var(--sunk);color:var(--ink);padding:4px 0;font-weight:500;font-variant-numeric:tabular-nums}
.week b.full{background:var(--ok);color:var(--surface)}
.week .cur{box-shadow:inset 0 0 0 2px var(--ink)}
.ev{flex-wrap:wrap}
.ev>.grow{flex:1 1 170px}
.ev .evbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chat{gap:14px}
.msgs{display:flex;flex-direction:column;gap:12px;height:min(52vh,520px);overflow-y:auto;padding:4px 2px;overscroll-behavior:contain}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.mb{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.mine .mb{align-items:flex-end}
.bub{background:var(--bg);border-radius:18px 18px 18px 6px;padding:10px 14px;text-align:left;font-size:17px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine .bub{background:var(--accent);color:var(--on-accent);border-radius:18px 18px 6px 18px;cursor:default}
.bub.quick{font-family:var(--display);font-size:21px}
.bub[disabled]{opacity:1}
.quote{display:block;font-size:12px;opacity:.8;border-left:3px solid currentColor;padding-left:7px;margin-bottom:5px;font-family:var(--body)}
.dayline{align-self:center;font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 12px}
.quickrow{display:flex;flex-wrap:wrap;gap:8px}
.qbtn{background:var(--sunk);border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:17px}
.quickrow.big .qbtn{font-size:22px;padding:12px 18px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:10px 16px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-family:var(--body);font-weight:700;margin-left:4px;vertical-align:2px}
.tab[aria-selected="true"] .badge{background:var(--on-accent);color:var(--accent)}
.mini{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 12px;min-width:0}
.mini span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
form.add .chips label{flex-direction:row;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);font-size:15px;cursor:pointer;position:relative}
form.add .chips label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
form.add .chips label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
form.add .chips input[type="checkbox"]{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chips-t{flex-basis:100%;font-size:13px;color:var(--muted)}
.avs{display:flex;flex:none}.avs .av+.av{margin-left:-10px}
.medsub{font-size:13px;color:var(--muted);margin:4px 0 -4px}
.sbar{position:relative;padding:26px 0 22px;min-width:0}
.sbar.small{padding:4px 0 18px}
.strack{position:relative;height:22px;border-radius:999px;background:var(--star-bg)}
.sbar.small .strack{height:14px}
.strack>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--star);min-width:14px}
.tick{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--line)}
.tick b{position:absolute;top:calc(100% + 3px);left:0;transform:translateX(-50%);font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick.first b{transform:none}.tick.last b{transform:translateX(-100%)}
.tick.reached{border-left-color:var(--surface)}
.rmark{position:absolute;bottom:calc(100% + 2px);transform:translateX(-50%);font-size:18px;line-height:1;filter:grayscale(1);opacity:.6}
.rmark.ok{filter:none;opacity:1}
.reward{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:16px;padding:10px 14px}
.reward .t{font-family:var(--display);font-size:19px;overflow-wrap:anywhere}
.reward>.grow{flex:1 1 150px}
.reward form{display:flex;gap:6px;align-items:center}
.reward input{width:76px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 8px}
.chip.ok{background:var(--ok);color:var(--surface)}
.lbox.rbox{width:46px;height:46px;flex:none}
.rbox[disabled]{cursor:default}.rbox[disabled]:not(.on){opacity:.45}
.rbox:not([disabled]):not(.on){border-color:var(--ok);border-width:3px}
.reward.used .t{text-decoration:line-through;color:var(--muted)}
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:10px 12px;margin-top:-4px}
.ask span{flex:1 1 160px}
.wx{background:var(--surface);border-radius:999px;padding:8px 18px;font-size:17px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.wx b{font-family:var(--display);font-weight:400;font-size:24px}
.fitpage .wx{padding:4px 14px}
.wxline .wx{display:inline-block;white-space:normal;background:var(--bg)}
.row>h3.grow{flex:1 1 6em}
.row>.grow>h3{white-space:nowrap}
.lunch{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.lunch th{font-weight:500;font-size:14px;color:var(--muted);text-align:center}
.lunch thead th span{display:block;font-size:11px;font-weight:400;font-variant-numeric:tabular-nums}
.lunch thead th.now{color:var(--accent);font-weight:700}
.lunch col.lname{width:88px}
.lunch tbody th{text-align:left}
.lunch tbody th div{white-space:nowrap}
.lunch tbody th div{display:flex;align-items:center;gap:6px;color:var(--ink);font-family:var(--display);font-size:17px;font-weight:400}
.lbox{width:100%;height:44px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-size:24px;font-weight:700;color:var(--surface);display:grid;place-items:center}
.lbox.on{background:var(--ok);border-color:var(--ok)}
td.now .lbox:not(.on){border-color:var(--accent)}
.fitpage .lbox{height:38px}
.tmbtn.on{background:var(--ok)}
@media (max-width:620px){.tmbtn .lb{display:none}.tmbtn{padding:6px 10px;font-size:17px}}
@media (max-width:560px){.taskrow{gap:6px}.tacts{gap:6px}.taskrow>.task{flex:1 1 150px}.task>.chip{font-size:11px;padding:3px 8px}.task .t{font-size:17px}.tbtn,.x{width:30px;height:30px}.taskrow>.open{order:9;margin-left:0}}
@media (max-width:480px){.wx{white-space:normal;font-size:15px}.lunch col.lname{width:78px}.lunch tbody th div{font-size:15px;gap:4px}}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a.link{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink);text-decoration:none;font-family:var(--display);font-size:16px;max-width:100%}
a.link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.link:hover{border-color:var(--accent)}
.open{background:var(--accent);color:var(--on-accent);border-color:var(--accent);border-radius:999px;padding:6px 12px;font-size:15px;text-decoration:none;font-family:var(--display);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none}
.menu{display:flex;flex-wrap:wrap;gap:6px}
.fitpage .menu{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.fitpage .open{font-size:13px;padding:4px 10px}
.fitpage .card>.row{gap:8px}
.fitpage .menu span{white-space:nowrap}
.menu span{background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px}
.note{display:block;font-size:13px;color:var(--muted);padding:2px 0 0 42px;overflow-wrap:anywhere}
.note b{font-weight:500;color:var(--ink)}
.tbtn{width:32px;height:32px;border-radius:50%;background:var(--sunk);flex:none;font-size:15px}
.ask input{flex:1 1 150px;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ask form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 220px}
.tm{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:10px}
.tmbig{font-family:var(--display);font-size:clamp(56px,16vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.tmbig.rest{color:var(--muted)}
.tmsub{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tmact{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tmact .btn{font-size:22px;padding:14px 30px}
.btn.stop{background:var(--sunk);color:var(--ink)}
.btn.done{background:var(--ok);color:var(--surface)}
.ring{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--bg);box-shadow:inset 0 0 0 10px var(--star-bg)}
.ring.run{box-shadow:inset 0 0 0 10px var(--ok)}
.ring.rest{box-shadow:inset 0 0 0 10px var(--line)}
.tmnote{background:var(--sunk);border-radius:16px;padding:12px 16px;max-width:520px}
.timed{display:block;font-size:13px;color:var(--muted);padding:2px 0 0 42px}
.timed b{color:var(--ok);font-weight:700}
.soon{border:3px dashed var(--line);background:transparent;text-align:center;padding:36px 20px}

.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.faces button{aspect-ratio:1;border-radius:18px;background:var(--bg);font-size:30px}
.faces button.on{box-shadow:inset 0 0 0 3px var(--accent)}
.pill{border-radius:999px;padding:6px 14px 6px 6px;background:var(--surface);display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:17px}
.pill.on{background:var(--accent);color:var(--on-accent)}
.stat{background:var(--bg);border-radius:16px;padding:12px 14px;flex:1;min-width:120px}
.stat b{font-family:var(--display);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}

const LUNAR=(()=>{for(const c of['dangi','chinese']){try{const f=new Intl.DateTimeFormat('en-u-ca-'+c,{month:'numeric',day:'numeric'});
  if(f.resolvedOptions().calendar===c)return f}catch(e){}}return null})();
const lunarCache={};
function lunarYear(y){if(lunarCache[y])return lunarCache[y];const map={};if(LUNAR){
  for(let d=new Date(y,0,1,12);d.getFullYear()===y;d.setDate(d.getDate()+1)){
   const p=LUNAR.formatToParts(d),m=p.find(x=>x.type==='month').value,dd=p.find(x=>x.type==='day').value;
   if(/^\d+$/.test(m))(map[m+'-'+dd]=map[m+'-'+dd]||[]).push(ds(d))}}
  return lunarCache[y]=map}
const leapY=y=>y%4===0&&(y%100!==0||y%400===0);
function yearDates(e,y){const[m,d]=e.md;
  if(e.yearly==='lunar'){const map=lunarYear(y);return map[m+'-'+d]||(d===30?map[m+'-29']:null)||[]}
  return[y+'-'+pad(m)+'-'+pad(m===2&&d===29&&!leapY(y)?28:d)]}
const dn=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5, fromDn=n=>new Date(n*864e5).toISOString().slice(0,10);
const skipped=(e,st)=>!!(e.skip&&e.skip.includes(st));
const evLen=e=>dn(e.end||e.date)-dn(e.date);
/* k일을 덮는 회차의 시작일. 반복: 매주(week)·매달(month), until까지 */
function occStart(e,k){const len=evLen(e),kd=dn(k),base=dn(e.date);
  if(!e.rep)return kd>=base&&kd<=base+len?e.date:null;
  const untilD=dn(e.until||e.date),day=+e.date.slice(8,10);
  for(let j=0;j<=len;j++){const sd=kd-j;if(sd<base||sd>untilD)continue;const st=fromDn(sd);
   if(e.rep==='week'){if((sd-base)%7===0&&!skipped(e,st))return st}
   else{const dim=new Date(Date.UTC(+st.slice(0,4),+st.slice(5,7),0)).getUTCDate();if(+st.slice(8,10)===Math.min(day,dim)&&!skipped(e,st))return st}}
  return null}

/* ---------- 별·보상: 50개마다 목표선, 보상은 은우도 추가, 별 개수는 엄마·아빠가 정함 ---------- */
const STEP=50;
const usedOn=r=>r.used||(r.given&&r.given.length?r.given[r.given.length-1]:null);
/* 보상을 고치거나 쓸 수 있는 사람: 엄마·아빠는 모두, 은우(태블릿)는 은우 것만 */
const canR=r=>isParent()||(isTablet()&&r.who==='eun');
function starBar(who,small){const n=S.stars[who]||0,rs=S.rewards.filter(r=>r.who===who&&r.cost>0&&!usedOn(r));
 const top=Math.max(STEP,Math.ceil((Math.max(n,0,...rs.map(r=>r.cost))+1)/STEP)*STEP),pct=v=>Math.min(100,v/top*100);
 let ticks='';for(let v=0;v<=top;v+=STEP)ticks+=`<span class="tick ${v===0?'first':v===top?'last':''} ${v>0&&v<top&&n>=v?'reached':''}" style="left:${pct(v)}%"><b>${v}</b></span>`;
 return `<div class="sbar ${small?'small':''}" role="img" aria-label="별 ${n}개, 다음 목표 ${Math.floor(n/STEP)*STEP+STEP}개"><div class="strack"><i style="width:${pct(n)}%"></i>${ticks}
  ${small?'':rs.map(r=>`<span class="rmark ${n>=r.cost?'ok':''}" style="left:${pct(r.cost)}%" title="${esc(r.t)} · 별 ${r.cost}개">🎁</span>`).join('')}</div></div>`}
const nextGoal=n=>Math.floor(n/STEP)*STEP+STEP;
function rewardView(){const kids=M.filter(m=>m.role==='child');
 return `<div class="grid">${kids.map(m=>{const n=S.stars[m.id]||0,mine=isParent()||(isTablet()&&m.id==='eun');
  const rs=S.rewards.filter(r=>r.who===m.id).sort((a,b)=>(usedOn(a)?1:0)-(usedOn(b)?1:0)||(a.cost||1e9)-(b.cost||1e9));
  return `<div class="card stack"><div class="row">${av(m.id,'lg')}<span class="d grow" style="font-size:28px">${m.name}</span><span class="chip" style="font-size:20px">⭐ ${n}</span></div>
   ${starBar(m.id)}
   <p class="small muted">다음 목표 ${nextGoal(n)}개까지 ${nextGoal(n)-n}개 남았어요. 할 일을 하나 끝낼 때마다 별 1개!</p>
   <h3>갖고 싶은 보상</h3>
   ${rs.length&&mine?'<p class="small muted">별이 모이면 왼쪽 네모를 눌러 보상을 사용해요. 사용하면 그만큼 별이 줄어요.</p>':''}
   ${rs.map(r=>{const used=usedOn(r),ok=!used&&r.cost>0&&n>=r.cost,can=canR(r);
    return `<div class="reward ${used?'used':''}">
     <button class="lbox rbox ${used?'on':''}" data-act="give" data-id="${r.id}" ${ok&&can?'':'disabled'} aria-pressed="${!!used}" aria-label="${esc(r.t)} 보상 사용${used?'함':''}">${used?'✓':''}</button>
     <div class="grow"><div class="t">${esc(r.t)}</div>
      <div class="small muted">${r.cost>0?`별 ${r.cost}개`:'별 몇 개인지는 엄마·아빠가 정해요'}${used?` · 사용한 날 ${nice(used)}`:''}</div></div>
     ${used?'':ok?'<span class="chip ok">사용할 수 있어요!</span>':r.cost>0?`<span class="chip">${r.cost-n}개 더</span>`:'<span class="chip">별 개수 기다리는 중</span>'}
     ${isParent()&&!used?`<form data-form="rcost" data-id="${r.id}"><input id="rc-${r.id}" name="cost" type="number" min="1" max="9999" placeholder="별 개수" value="${r.cost||''}" aria-label="차감할 별 개수"><button class="btn ghost sm">정하기</button></form>`:''}
     ${can?`<button class="x" data-act="delreward" data-id="${r.id}" aria-label="보상 지우기">✕</button>`:''}</div>
     ${ui.giveAsk===r.id?`<div class="ask"><span>별 ${r.cost}개를 쓰고 "${esc(r.t)}" 보상을 사용할까요?</span><button class="btn sm" data-act="give1" data-id="${r.id}">네</button><button class="btn ghost sm" data-act="delno">취소</button></div>`:''}
     ${ui.delR===r.id?`<div class="ask"><span>"${esc(r.t)}" 보상을 지울까요?</span><button class="btn sm" data-act="delreward1" data-id="${r.id}">네</button><button class="btn ghost sm" data-act="delno">취소</button></div>`:''}`}).join('')||'<p class="muted">아직 보상이 없어요. 갖고 싶은 걸 적어 보세요!</p>'}
   ${mine?`<form class="add" data-form="reward" data-who="${m.id}"><input id="rw-${m.id}" name="t" placeholder="예: 레고 사기, 게임 30분 더" required maxlength="30"><button class="btn">보상 추가</button></form>`:''}
  </div>`}).join('')}</div>`}

/* ---------- 공부 타이머: 시작/중지/완료. 쉰 시간은 중지해 둔 동안 ---------- */
const tm=(id,d)=>(S.timers[d]&&S.timers[d][id])||null;
const nowS=()=>Math.floor(Date.now()/1000);
/* 지금까지 공부한 시간(초): 저장된 sec + 돌아가는 중이면 그만큼 더 */
const tmSec=z=>(z?z.sec||0:0)+(z&&z.start?Math.max(0,nowS()-z.start):0);
const tmBrk=z=>(z?z.brk||0:0)+(z&&z.bstart?Math.max(0,nowS()-z.bstart):0);
function hms(n){n=Math.max(0,Math.round(n));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;
 return(h?h+':'+pad(m):m)+':'+pad(s)}
function hm2(n){n=Math.max(0,Math.round(n/60));const h=Math.floor(n/60),m=n%60;return(h?h+'시간 ':'')+(m||!h?m+'분':'')}
function timerSummary(id,d){const z=tm(id,d);if(!z||(!z.sec&&!z.start))return'';
 const f=tmSec(z),b=tmBrk(z),p=f+b?Math.round(f/(f+b)*100):100;
 return `⏱ 공부 <b>${hm2(f)}</b>${b?` · 쉼 ${hm2(b)}`:''}${f+b>=60?` · 집중 ${p}%`:''}`}
function timerStart(id){const d=today,z=tm(id,d)||{},o={};
 if(z.bstart)o['timers.'+d+'.'+id+'.brk']=(z.brk||0)+Math.max(0,nowS()-z.bstart);
 o['timers.'+d+'.'+id+'.bstart']=deleteField();o['timers.'+d+'.'+id+'.start']=nowS();
 o['timers.'+d+'.'+id+'.sec']=z.sec||0;o['timers.'+d+'.'+id+'.brk']=o['timers.'+d+'.'+id+'.brk']!=null?o['timers.'+d+'.'+id+'.brk']:(z.brk||0);
 upd(o);keepAwake()}
function timerStop(id){const d=today,z=tm(id,d);if(!z||!z.start)return;
 upd({['timers.'+d+'.'+id+'.sec']:(z.sec||0)+Math.max(0,nowS()-z.start),['timers.'+d+'.'+id+'.start']:deleteField(),['timers.'+d+'.'+id+'.bstart']:nowS()});dropAwake()}
function timerDone(id){const d=today,z=tm(id,d)||{},t=S.tasks.find(x=>x.id===id);
 const sec=tmSec(z),o={['timers.'+d+'.'+id+'.sec']:sec,['timers.'+d+'.'+id+'.brk']:tmBrk(z),
  ['timers.'+d+'.'+id+'.start']:deleteField(),['timers.'+d+'.'+id+'.bstart']:deleteField(),['timers.'+d+'.'+id+'.end']:nowS()};
 if(t&&!isDone(t,d)&&canDo(t.who,d)){o['done.'+d+'.'+id]=true;if(t.who in S.stars)o['stars.'+t.who]=increment(1)}
 upd(o);dropAwake();ui.timer=null;ui.td=d;ui.tab='todo'}
let wl=null;
function keepAwake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(x=>{wl=x;x.addEventListener('release',()=>{wl=null})}).catch(()=>{})}catch(e){}}
function dropAwake(){try{if(wl){wl.release();wl=null}}catch(e){}}
function timerView(){const id=ui.timer,t=S.tasks.find(x=>x.id===id);
 if(!t)return '<div class="card stack"><p class="muted">할 일을 찾을 수 없어요.</p><button class="btn ghost" data-act="tmback">돌아가기</button></div>';
 const z=tm(id,today),run=!!(z&&z.start),rest=!!(z&&z.bstart),f=tmSec(z),b=tmBrk(z);
 return `<div class="card stack tm">
  <div class="row" style="width:100%"><button class="btn ghost sm" data-act="tmback">‹ 할 일로</button><span class="grow"></span>${av(t.who,'sm')}<span class="small muted">${by(t.who).name}</span></div>
  <h2 style="font-size:30px">${esc(t.t)}</h2>
  <div class="ring ${run?'run':rest?'rest':''}"><div><div class="tmbig ${run?'':'rest'}" id="tmclock">${hms(f)}</div>
   <p class="muted">${run?'공부 중이에요':rest?'쉬는 중이에요':f?'잠깐 멈췄어요':'시작을 눌러 주세요'}</p></div></div>
  <div class="tmsub"><span class="chip">공부 ${hm2(f)}</span><span class="chip">쉼 ${hm2(b)}</span>${f+b>=60?`<span class="chip">집중 ${Math.round(f/(f+b)*100)}%</span>`:''}</div>
  <div class="tmact">${run?`<button class="btn stop" data-act="tmstop" data-id="${id}">⏸ 중지</button>`
    :`<button class="btn" data-act="tmstart" data-id="${id}">▶ ${f?'다시 시작':'공부 시작'}</button>`}
   <button class="btn done" data-act="tmdone" data-id="${id}">✓ 완료</button></div>
  ${ui.away?`<p class="tmnote">${esc(by(t.who).name)}님, 다른 화면에 ${hm2(ui.away)} 다녀왔어요. 지금은 "${esc(t.t)}"에 집중해 주세요!</p>`:''}
  <p class="small muted">완료를 누르면 할 일도 자동으로 체크돼요. 쉬는 시간은 ⏸ 중지를 누른 동안만 세요.<br>
   다른 앱으로 가는 것을 막을 수는 없지만, 자리를 비우면 알림으로 알려 드려요.</p></div>`}
/* 타이머가 돌아가는 동안 1초마다 숫자만 바꿈 */
setInterval(()=>{const el=document.getElementById('tmclock');if(!el||!ui.timer)return;
 const z=tm(ui.timer,today);if(z&&(z.start||z.bstart))el.textContent=hms(tmSec(z))},1000);
/* 공부 중에 다른 화면으로 가면 알림 */
document.addEventListener('visibilitychange',()=>{
 const id=ui.timer,z=id&&tm(id,today);if(!z||!z.start)return;
 if(document.hidden){ui.awayAt=nowS();
  const t=S.tasks.find(x=>x.id===id);
  try{if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&navigator.serviceWorker)
   navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification('지금은 "'+(t?t.t:'공부')+'"에 집중해 주세요',{body:'타이머가 돌아가고 있어요. 앱으로 돌아와 주세요.',tag:'hafamily-focus',icon:'icon-192.png'}))}catch(e){}}
 else if(ui.awayAt){ui.away=nowS()-ui.awayAt;ui.awayAt=0;render(true)}});

function todoView(){
 const d=ui.td,isToday=d===today,ids=M.map(m=>m.id),order=isTablet()?ids:[ui.me].concat(ids.filter(i=>i!==ui.me));
 const week=id=>{let h='';for(let i=6;i>=0;i--){const k=fromDn(dn(d)-i),[a,b]=prog(id,k);
   h+=`<button class="${k===d?'cur':''}" data-act="tgo" data-d="${k}" aria-label="${nice(k)}요일 ${b}개 중 ${a}개 완료">${WD[new Date(k+'T00:00').getDay()]}<b class="${b&&a===b?'full':''}">${b?a+'/'+b:'-'}</b></button>`}
  return `<div class="week">${h}</div>`};
 return `<div class="card row"><button class="btn ghost sm" data-act="tday" data-n="-1" aria-label="전날">‹</button>
   <h3 class="grow" style="text-align:center">${nice(d)}요일${isToday?' · 오늘':''}</h3>
   <button class="btn ghost sm" data-act="tday" data-n="1" aria-label="다음 날" ${isParent()?(d>=fromDn(dn(today)+14)?'disabled style="opacity:.4"':''):(isToday?'disabled style="opacity:.4"':'')}>›</button>
   ${isToday?'':'<button class="btn sm" data-act="tgo" data-d="'+today+'">오늘로</button>'}</div>

const QUICK_KID=['사랑해요 😍','안녕히 주무세요 🌙','보고 싶어요 🥺','배고파요 🍚','다 했어요! ✅','언제 와요? 🚗'];
const QUICK_PARENT=['사랑해 ❤️','알았어 👍','곧 갈게 🚗','잘했어 👏','전화할게 📞','밥 먹자 🍚'];
const sender=()=>isTablet()?'eun':ui.me;
const canType=()=>sender()!=='yeon';
const nameOf=id=>by(id)?by(id).name:'';
const readKey=()=>ui.me;
const unread=()=>{if(!ui.me)return 0;const r=S.reads[readKey()]||0,me=sender();return MSG.filter(m=>m.ts>r&&m.from!==me).length};
function hm(ts){const d=new Date(ts),h=d.getHours();return(h<12?'오전 ':'오후 ')+((h%12)||12)+':'+pad(d.getMinutes())}
function chatView(){
 const me=sender();let lastDay='';
 const bubbles=MSG.map(m=>{const mine=m.from===me,rep=m.reply&&MSG.find(x=>x.id===m.reply),dd=ds(new Date(m.ts));
  const line=dd!==lastDay?`<span class="dayline">${dd===today?'오늘':nice(dd)+'요일'}</span>`:'';lastDay=dd;
  return line+`<div class="msg ${mine?'mine':''}">${mine?'':av(m.from,'sm')}<div class="mb">
   ${mine?'':`<span class="small muted">${nameOf(m.from)}</span>`}
   <button class="bub ${m.quick?'quick':''}" data-act="replyto" data-id="${m.id}" ${mine?'disabled':''} aria-label="${mine?'내 메시지':nameOf(m.from)+' 메시지에 답장'}">${rep?`<span class="quote">${nameOf(rep.from)}: ${esc(rep.text.slice(0,40))}</span>`:''}${esc(m.text)}</button>
   <span class="small muted">${hm(m.ts)}</span></div></div>`}).join('');
 const target=ui.replyTo&&MSG.find(x=>x.id===ui.replyTo);
 const quick=by(me).role==='parent'?QUICK_PARENT:QUICK_KID;
 return `<div class="card stack chat">
  <div class="row"><h3 class="grow">우리가족 방</h3><span class="muted">${M.map(m=>S.faces[m.id]).join(' ')}</span></div>
  ${chatErr?`<div class="row notice"><span class="grow">${esc(chatErr)}</span><button class="btn ghost sm" data-act="msgretry">다시 불러오기</button></div>`
   :!MSG.length?`<div class="row notice"><span class="grow small">메시지가 하나도 안 보이면 눌러 보세요.</span><button class="btn ghost sm" data-act="msgretry">다시 불러오기</button></div>`:''}
  ${pushCard()}
  <div class="msgs" id="msgs">${bubbles||'<p class="muted" style="text-align:center;margin:auto">아직 메시지가 없어요. 첫 인사를 보내 보세요!</p>'}</div>
  ${target?`<div class="row notice"><span class="grow">${nameOf(target.from)}의 "${esc(target.text.slice(0,30))}"에 답장</span><button class="x" data-act="replyx" aria-label="답장 취소">✕</button></div>`:''}

  ${canType()?`<form class="sendrow" data-form="msg"><input id="msg-text" name="t" placeholder="직접 써서 보내기" maxlength="300" autocomplete="off" enterkeyhint="send"><button class="btn">보내기</button></form>`:''}

 </div>`}
function sendMsg(text,quick){const from=sender();text=(text||'').trim();if(!ready||!text||!from)return;

const IOS_HINT='이 기기에서는 알림을 켤 수 없어요. 아이폰·아이패드는 사파리에서 "홈 화면에 추가"한 앱 아이콘으로 열어서 켜 주세요.';
const pushOn=()=>!!lsGet('hafamily-push')&&typeof Notification!=='undefined'&&Notification.permission==='granted';
async function saveToken(who){
 const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
 const token=await getToken(getMessaging(fbApp),{serviceWorkerRegistration:reg});
 if(!token)throw new Error('토큰 없음');
 await setDoc(doc(fdb,'families','main','devices',DEV),{token,who,updated:Date.now(),ua:navigator.userAgent.slice(0,120)});
 lsSet('hafamily-push',who)}
function enablePush(){
 if(typeof Notification==='undefined'||!('serviceWorker' in navigator)){ui.pushMsg=IOS_HINT;render();return}
 const who=isTablet()?'tablet':ui.me;
 Notification.requestPermission().then(async perm=>{
  if(perm!=='granted'){ui.pushMsg='알림이 허용되지 않았어요. 기기 설정에서 이 앱(또는 브라우저)의 알림을 허용한 뒤 다시 눌러 주세요.';render();return}
  if(!(await pushSupported())){ui.pushMsg=IOS_HINT;render();return}
  ui.pushMsg='알림을 켜는 중…';render();
  await saveToken(who);ui.pushMsg='이 기기에서 알림을 받아요. 다른 가족이 메시지를 보내면 알려 드려요.';render()
 }).catch(e=>{ui.pushMsg='알림을 켜지 못했어요 ('+(e.code||e.message)+')';render()})}
function disablePush(){deleteDoc(doc(fdb,'families','main','devices',DEV)).catch(()=>{});lsSet('hafamily-push',null);ui.pushMsg='이 기기의 알림을 껐어요.';render()}
function pushCard(){const on=pushOn(),who=lsGet('hafamily-push');
 return `<div class="row notice"><span class="grow">${on?`🔔 이 기기에서 알림을 받고 있어요${who&&who!=='tablet'&&by(who)?' ('+by(who).name+')':who==='tablet'?' (공용 태블릿)':''}`:'🔕 이 기기는 메시지 알림이 꺼져 있어요'}</span>

/* ---------- 날씨 (Open-Meteo, 키 없이 무료) ---------- */
let WX=null,wxKey='';
const WXC=c=>c===0?['☀️','맑음']:c<=2?['🌤️','구름 조금']:c===3?['☁️','흐림']:c<=48?['🌫️','안개']:c<=57?['🌦️','이슬비']:c<=67?['🌧️','비']:c<=77?['❄️','눈']:c<=82?['🌧️','소나기']:c<=86?['🌨️','눈']:['⛈️','뇌우'];
function loadWx(force){const w=S.settings.weather;if(!w)return;const u=w.unit==='C'?'C':'F',key=w.lat+','+w.lon+','+u+','+today;
 if(!force&&key===wxKey)return;wxKey=key;
 fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=1${u==='F'?'&temperature_unit=fahrenheit':''}`)
  .then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok||!j||j.error)throw new Error((j&&j.reason)||('서버 응답 '+r.status));return j})
  .then(j=>{const d=j.daily||{};WX={max:d.temperature_2m_max[0],min:d.temperature_2m_min[0],pop:d.precipitation_probability_max?d.precipitation_probability_max[0]:null,code:d.weather_code[0],cur:j.current?j.current.temperature_2m:null,ccode:j.current?j.current.weather_code:null,u};render(true)})
  .catch(e=>{WX={err:String(e&&e.message||e||'알 수 없는 오류').slice(0,80)};wxKey='';render(true)})}
function wxChip(){if(!S.settings.weather)return isParent()?'<button class="wx" data-act="wxgo">🌤️ 날씨 지역 정하기</button>':'<span class="wx muted">🌤️ 날씨: 엄마·아빠 폰에서 지역을 정해 주세요</span>';if(!WX)return'<span class="wx muted">날씨 불러오는 중…</span>';if(WX.err)return'<span class="wx muted">날씨를 못 불러왔어요</span>';
 const[ic,txt]=WXC(WX.ccode!=null?WX.ccode:WX.code),r=Math.round;
 return `<span class="wx" title="${esc(S.settings.weather.name)}">${ic} ${WX.cur!=null?`<b>${r(WX.cur)}°</b> `:''}${txt} · 최고 ${r(WX.max)}° 최저 ${r(WX.min)}°${WX.pop!=null?` · ${WX.pop>=50?'☔ ':''}강수 ${WX.pop}%`:''}</span>`}
function alertish(m){ui.msg2=m;render();setTimeout(()=>{ui.msg2='';render()},4000)}
function wxSearch(q){if(!q)return;ui.wxRes=null;ui.wxMsg='찾는 중…';render();
 fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ko&format=json`).then(r=>r.json())
  .then(j=>{ui.wxRes=(j.results||[]).map(x=>({name:[x.name,x.admin1,x.country].filter(Boolean).join(', '),lat:+x.latitude.toFixed(3),lon:+x.longitude.toFixed(3)}));ui.wxMsg=ui.wxRes.length?'':'찾지 못했어요. 영어 도시 이름으로도 해보세요 (예: Atlanta).';render()})
  .catch(()=>{ui.wxMsg='검색하지 못했어요. 인터넷 연결을 확인해 주세요.';render()})}

function wxCard(){const w=S.settings.weather;
 return `<div class="card stack"><h3>대시보드 날씨</h3>${w?`<div class="wxline">${wxChip()}</div>`:''}
  <p class="small muted">${w?`지역: ${esc(w.name)}`:'지역을 정하면 홈 화면 위쪽에 오늘 날씨가 나와요. 도시 이름을 찾아서 고르면 돼요.'}</p>

  <form class="add" data-form="wxq"><input id="wx-q" name="q" placeholder="도시 이름 (예: 애틀랜타, Atlanta)" maxlength="40"><button class="btn">찾기</button></form>

  ${w?`<div class="row"><span class="small muted">온도 단위</span>${['F','C'].map(u=>`<button class="pill ${(w.unit||'F')===u?'on':''}" style="padding:6px 14px" data-act="wxunit" data-u="${u}">°${u}</button>`).join('')}</div>`:''}</div>`}
let actx=null;
function ding(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
 [880,1175].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.12);
  g.gain.exponentialRampToValueAtTime(.18,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.3);o.connect(g);g.connect(actx.destination);o.start(t+i*.12);o.stop(t+i*.12+.32)});
 if(navigator.vibrate)navigator.vibrate(120)}catch(e){}}

const app=document.getElementById('app');
/* 다른 기기에서 바뀐 내용으로 다시 그릴 때, 입력 중이던 칸은 그대로 둠 */
const dirty=el=>el.type==='checkbox'?el.checked!==el.defaultChecked:el.tagName==='SELECT'?[...el.options].some(o=>o.selected!==o.defaultSelected):el.value!==el.defaultValue;
function render(keep){
 let vals=null,foc=null;const mb=document.getElementById('msgs'),atEnd=!mb||mb.scrollHeight-mb.scrollTop-mb.clientHeight<60,oldTop=mb?mb.scrollTop:0;
 if(keep){vals={};app.querySelectorAll('input[id],select[id]').forEach(el=>{if(dirty(el))vals[el.id]=el.type==='checkbox'?el.checked:el.value});
  const a=document.activeElement;if(a&&a.id&&app.contains(a))foc=a.id}
 app.className='wrap'+(ui.view==='main'&&isTablet()?' wide':'');
 document.documentElement.classList.toggle('fitpage',ui.view==='main'&&isTablet()&&ui.tab==='home');
 app.innerHTML=ui.view==='loading'?loadingView():ui.view==='login'?loginView():ui.view==='who'?whoView():ui.view==='pin'?pinView():mainView();
 if(vals){for(const id in vals){const el=document.getElementById(id);if(el){if(el.type==='checkbox')el.checked=vals[id];else el.value=vals[id]}}
  if(foc){const el=document.getElementById(foc);if(el)el.focus()}}

 markRead()}
function markRead(){if(!ready||ui.view!=='main'||ui.tab!=='chat'||!MSG.length)return;const lt=MSG[MSG.length-1].ts,k=readKey();

}
/* 아이·공용 태블릿은 이 기기에서 기억, 엄마·아빠는 매번 비밀번호 */
const ME_KEY='hafamily-me';
const remembered=()=>{try{const v=localStorage.getItem(ME_KEY);return v==='eun'||v==='yeon'?'tablet':['tablet','mom','dad'].includes(v)?v:null}catch(e){return null}};
const remember=v=>{try{if(v)localStorage.setItem(ME_KEY,v);else localStorage.removeItem(ME_KEY)}catch(e){}};
function enter(id){ui.td=today;ui.me=id;ui.tab=ui.startChat?'chat':'home';ui.startChat=false;ui.view='main';ui.pick=null;ui.hp=id==='tablet'?'eun':id;
 const kid=id==='tablet'||by(id).role==='child';remember(kid||ui.pinRemember?id:null);if(kid)lsSet('hafamily-kiddev','1')}
async function hashPin(who,pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hafamily:'+who+':'+pin));
 return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function checkPin(){const who=ui.pend;
 hashPin(who,ui.pin).then(h=>{
  if(ui.pinNew||!S.pins[who]){upd({['pins.'+who]:h});ui.pinNew=false;ui.pinMsg='';enter(who)}
  else if(S.pins[who]===h){ui.pinMsg='';enter(who)}
  else{ui.pin='';ui.pinMsg='비밀번호가 달라요. 다시 눌러 주세요.'}
  render()}).catch(()=>{ui.pin='';ui.pinMsg='이 브라우저에서는 비밀번호를 확인할 수 없어요.';render()})}

 else if(a==='tsend'&&isTablet()){ui.tsend=id;ui.replyTo=null}
 else if(a==='toggle'){const t=S.tasks.find(x=>x.id===id),d=b.dataset.d||today;if(t&&canDo(t.who,d)){const on=!isDone(t,d),o={['done.'+d+'.'+t.id]:on?true:deleteField()};
   if(t.who in S.stars){if(on)o['stars.'+t.who]=increment(1);else if(S.stars[t.who]>0)o['stars.'+t.who]=increment(-1)}upd(o)}}
 else if(a==='med'){const m=S.meds.find(x=>x.id===id),k=b.dataset.k||id;if(m&&canCheck(m.who))upd({['took.'+today+'.'+k]:tookOn(k)?deleteField():true})}
 else if(a==='deltask'&&isParent()){const t=S.tasks.find(x=>x.id===id);if(t){if(t.daily)ui.delAsk=t.id;else upd({['tasks.'+t.id]:deleteField()})}}
 else if(a==='deltask1'&&isParent()){upd({['tasks.'+id+'.skip']:arrayUnion(b.dataset.d)});ui.delAsk=null}
 else if(a==='deltaskall'&&isParent()){const t=S.tasks.find(x=>x.id===id);if(t)upd(ui.td>t.from?{['tasks.'+t.id+'.stop']:ui.td}:{['tasks.'+t.id]:deleteField()});ui.delAsk=null}
 else if(a==='delno'){ui.delAsk=null;ui.giveAsk=null;ui.delR=null;ui.noteAsk=null;ui.linkAsk=null;ui.scAsk=false}
 else if(a==='tmgo'){const t=S.tasks.find(x=>x.id===id);if(t&&canDo(t.who,today)){ui.timer=id;ui.away=0;ui.tab='todo'}}

 else if(a==='scadd'&&isParent()){ui.scAsk=!ui.scAsk}

 else if(a==='delsc'&&isParent()){upd({['shortcuts.'+id]:deleteField()})}
 else if(a==='give'){const r=S.rewards.find(x=>x.id===id);if(r&&canR(r)&&!usedOn(r)&&r.cost>0&&(S.stars[r.who]||0)>=r.cost){ui.giveAsk=id;ui.delR=null}}
 else if(a==='wxgo'){ui.tab='home';render();const el=document.getElementById('wx-q');if(el){if(el.scrollIntoView)el.scrollIntoView({block:'center'});el.focus()}return}
 else if(a==='wxretry'){WX=null;loadWx(true)}
 else if(a==='gcalnow'&&isParent()){upd({'settings.gcalPing':Date.now(),'settings.gcalErr':''})}
 else if(a==='gcaloff'&&isParent()){upd({'settings.gcalUrl':'','settings.gcalErr':'',gcal:{}})}
 else if(a==='lunch'&&LUNCH.includes(id)){const d=b.dataset.d;upd({['lunch.'+d+'.'+id]:lunchOn(d,id)?deleteField():true})}
 else if(a==='wxpick'&&isParent()){const x=(ui.wxRes||[])[+b.dataset.i];if(x){upd({['settings.weather']:{name:x.name,lat:x.lat,lon:x.lon,unit:(S.settings.weather&&S.settings.weather.unit)||'F'}});ui.wxRes=null;ui.wxMsg='';WX=null;wxKey=''}}
 else if(a==='wxunit'&&isParent()&&S.settings.weather){upd({['settings.weather.unit']:b.dataset.u});WX=null;wxKey=''}
 else if(a==='give1'){const r=S.rewards.find(x=>x.id===id);if(r&&canR(r)&&!usedOn(r)&&r.cost>0&&(S.stars[r.who]||0)>=r.cost)upd({['stars.'+r.who]:increment(-r.cost),['rewards.'+id+'.used']:today});ui.giveAsk=null}
 else if(a==='delreward'){const r=S.rewards.find(x=>x.id===id);if(r&&canR(r)){ui.delR=id;ui.giveAsk=null}}
 else if(a==='delreward1'){const r=S.rewards.find(x=>x.id===id);if(r&&canR(r))upd({['rewards.'+id]:deleteField()});ui.delR=null}
 else if(a==='delmed'&&isParent()){upd({['meds.'+id]:deleteField()})}
 else if(a==='delgrow'&&isParent()){upd({['growth.'+id]:deleteField()})}
 else if(a==='delev'){const ev=S.events.find(x=>x.id===id);if(ev&&!ev.g&&(ev.yearly?isParent():canEv()))upd({['events.'+id]:deleteField()})}
 else if(a==='day'){ui.sel=b.dataset.d;if(ui.tab==='home')ui.tab='cal'}
 else if(a==='mon'){const d=new Date(ui.ym[0],ui.ym[1]+(+b.dataset.n),1);ui.ym=[d.getFullYear(),d.getMonth()]}
 else if(a==='hp'){ui.hp=id}
 else if(a==='grow'){ui.hp=id;ui.tab='health'}
 else if(a==='gm'){ui.gm=b.dataset.k}
 else if(a==='pickopen'){ui.pick=ui.me}
 else if(a==='pickclose'){ui.pick=null}
 else if(a==='pickwho'&&isParent()){ui.pick=id}
 else if(a==='face'&&ui.pick&&(isParent()||ui.pick===ui.me)){upd({['faces.'+ui.pick]:b.dataset.f})}
 else if(a==='tday'){ui.delAsk=null;ui.noteAsk=null;ui.linkAsk=null;const k=fromDn(dn(ui.td)+(+b.dataset.n));if(k<=today||(isParent()&&k<=fromDn(dn(today)+14)))ui.td=k}
 else if(a==='tgo'){if(b.dataset.d<=today){ui.td=b.dataset.d;ui.noteAsk=null;ui.linkAsk=null}}
 else if(a==='skipev'){const ev=S.events.find(x=>x.id===id);if(ev&&ev.rep&&canEv())upd({['events.'+id+'.skip']:arrayUnion(b.dataset.d)})}
 render();

 if(t.id==='ev-date'){const en=document.getElementById('ev-end'),un=document.getElementById('ev-until');

app.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form,v=n=>f.elements[n].value.trim(),chk=n=>[...f.querySelectorAll('input[name="'+n+'"]:checked')].map(x=>x.value);
 if(k==='login'){ui.loginErr='';
  signInWithEmailAndPassword(auth,v('email'),f.elements.pw.value).catch(err=>{const c=err.code||'';
   ui.loginErr=/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'이메일이나 비밀번호가 맞지 않아요.':
    /too-many-requests/.test(c)?'여러 번 틀려서 잠시 막혔어요. 조금 뒤에 다시 해 주세요.':/network/.test(c)?'인터넷 연결을 확인해 주세요.':'로그인하지 못했어요 ('+c+')';render()});
  return}
 if(k==='msg'){const t=f.elements.t.value;if(t.trim()){sendMsg(t,false);f.elements.t.value=''}render();const el=document.getElementById('msg-text');if(el)el.focus();return}
 if(k==='tnote'){const id=f.dataset.id,d=f.dataset.d,t=S.tasks.find(x=>x.id===id),o={};
  if(t&&canDo(t.who,d)){const v2=v('t');o['notes.'+d+'.'+id]=v2?v2:deleteField()}
  if(t&&isParent()&&f.elements.url){const u=safeUrl(f.elements.url.value);o['tlinks.'+d+'.'+id]=u?u:deleteField()}
  if(Object.keys(o).length)upd(o);
  ui.noteAsk=null;render();return}
 if(k==='sc'){if(!isParent())return;const u=safeUrl(v('url'));if(!v('t')||!u)return;
  upd({['shortcuts.'+newId('s')]:{t:v('t'),url:u}});ui.scAsk=false;render();return}
 if(k==='reward'){const who=f.dataset.who;if(!v('t')||!(isParent()||(isTablet()&&who==='eun')))return;
  upd({['rewards.'+newId('r')]:{who,t:v('t'),cost:null,by:isTablet()?'eun':ui.me}});render();return}
 if(k==='rcost'){if(!isParent())return;const c=parseInt(v('cost'),10);upd({['rewards.'+f.dataset.id+'.cost']:c>0?c:null});render();return}
 if(k==='wxq'){if(!isParent())return;wxSearch(v('q'));return}
 if(k==='gcal'){if(!isParent())return;let u=v('url').replace(/^webcal:\/\//i,'https://');
  if(u&&!/^https:\/\//i.test(u)){alertish('주소가 https로 시작해야 해요.');return}
  upd({'settings.gcalUrl':u,'settings.gcalErr':'','settings.gcalPing':Date.now()});render();return}
 const jump=date=>{ui.sel=date;const d=new Date(date+'T00:00');ui.ym=[d.getFullYear(),d.getMonth()]};
 if(k==='event'){if(!canEv()||!v('t')||!v('date'))return;const date=v('date'),end=v('end');
  const ws=chk('w'),pp=ws.filter(x=>x!=='all');
  const ev={date,time:v('time'),t:v('t'),who:!pp.length||ws.includes('all')||pp.length===M.length?'all':pp.length===1?pp[0]:pp};if(end>date)ev.end=end;
  const rp=v('rep'),until=v('until');
  if(rp){if(!until||until<=date){const er=document.getElementById('ev-err');er.textContent='반복을 고르면, 시작하는 날보다 뒤로 언제까지 반복할지도 정해주세요.';er.hidden=false;return}
   ev.rep=rp;ev.until=until}
  upd({['events.'+newId('e')]:ev});jump(date)}
 else if(k==='anniv'){if(!isParent()||!v('t'))return;const m=+v('m'),d=+v('d'),cal=f.elements.lunar.checked&&LUNAR?'lunar':'solar';
  const max=cal==='lunar'?30:[31,29,31,30,31,30,31,31,30,31,30,31][m-1];
  if(d>max){ui.err=(cal==='lunar'?'음력 ':'')+m+'월은 '+max+'일까지 있어요.';render();return}
  const ev={yearly:cal,md:[m,d],time:'',t:v('t'),who:'all'};upd({['events.'+newId('e')]:ev});ui.err='';
  const o=nextOcc(ev);if(o)jump(o.date)}
 else{ if(!isParent())return;
  if(k==='task'){if(!v('t'))return;const r=v('rep'),nt={who:v('who'),t:v('t')};if(r==='once')nt.date=ui.td;else{nt.daily=true;nt.from=ui.td;if(r==='wk')nt.wk=true;
   if(r==='days'){const dd=chk('tdays').map(Number);if(!dd.length)return;nt.days=dd}}
   upd({['tasks.'+newId('t')]:nt})}
  if(k==='sup'){if(!v('t'))return;upd({['meds.'+newId('m')]:{kind:'sup',who:ui.hp,t:v('t'),when:v('when')}})}
  if(k==='med'){const from=v('from'),n=Math.max(1,Math.min(90,parseInt(v('days'),10)||0)),tm=chk('tm');if(!v('t')||!from||!tm.length)return;
   upd({['meds.'+newId('m')]:{kind:'med',who:ui.hp,t:v('t'),from,to:fromDn(dn(from)+n-1),times:TIMES.filter(t=>tm.includes(t))}})}
  if(k==='grow'){const cm=parseFloat(v('cm')),kg=parseFloat(v('kg'));if(!v('date')||!(cm>0)||!(kg>0))return;
   upd({['growth.'+newId('g')]:{who:ui.hp,date:v('date'),cm,kg}})}
  if(k==='info'){upd({['info.'+ui.hp]:{birth:v('birth'),sex:v('sex'),blood:v('blood'),allergy:v('allergy'),clinic:v('clinic'),memo:v('memo')}})}
 }
 render();
});

setInterval(()=>{if(ds(new Date())!==today)location.reload()},60000);

let unsub=null,unsubM=null,knownMsg=null;
onAuthStateChanged(auth,user=>{
 if(unsub){unsub();unsub=null}
 if(unsubM){unsubM();unsubM=null}
 MSG=[];knownMsg=null;
 ready=false;syncErr='';
 if(!user){ui.view='login';ui.me=null;render();return}
 ui.view='loading';render();
 unsub=onSnapshot(REF,snap=>{
  if(!snap.exists()){if(!snap.metadata.fromCache)setDoc(REF,seedDoc()).catch(err=>{syncErr='처음 설정을 저장하지 못했어요 ('+err.code+'). 보안 규칙을 확인해 주세요.';render()});return}
  S=fromDoc(snap.data());syncErr='';loadWx();loadMenu();
  if(!ready){ready=true;
   if(!S.settings.seedLinks&&isParent&&!S.shortcuts.length){const o={'settings.seedLinks':true};SEED_LINKS.forEach(x=>o['shortcuts.'+newId('s')]=x);setTimeout(()=>upd(o),0)}
   if(pushOn())pushSupported().then(ok=>ok&&saveToken(lsGet('hafamily-push'))).catch(()=>{});
   const r=remembered();if(r)enter(r);else ui.view='who';render();return}
  render(true)},
 err=>{syncErr=err.code==='permission-denied'?'이 계정으로는 가족 데이터를 볼 수 없어요. Firestore 보안 규칙에 적은 이메일과 로그인한 이메일이 같은지 확인해 주세요.':'연결하지 못했어요 ('+err.code+')';render()});
 listenMsgs()});
/* 메시지 듣기: 시간순 정렬이 막히면 정렬 없이 다시 시도 */
function listenMsgs(){
 if(unsubM){unsubM();unsubM=null}
 const q=msgFallback?fsQuery(MSGS,fsLimit(300)):fsQuery(MSGS,fsOrderBy('ts','desc'),fsLimit(100));
 unsubM=onSnapshot(q,snap=>{
  MSG=snap.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'})||{};const t=x.ts&&x.ts.toMillis?x.ts.toMillis():Date.now();
   return{id:d.id,from:x.from,text:String(x.text||''),quick:!!x.quick,reply:x.reply||null,ts:t}}).filter(m=>by(m.from));
  MSG=msgFallback?MSG.sort((a,b)=>a.ts-b.ts):MSG.reverse();
  chatErr='';
  const ids=new Set(MSG.map(m=>m.id));
  if(knownMsg&&ui.view==='main'&&MSG.some(m=>!knownMsg.has(m.id)&&m.from!==sender()))ding();
  knownMsg=ids;render(true)},
 err=>{
  if(!msgFallback&&err.code!=='permission-denied'){msgFallback=true;listenMsgs();return}
  chatErr=err.code==='permission-denied'?'메시지를 볼 수 없어요. Firestore 보안 규칙에 messages 부분이 들어갔는지 확인해 주세요.':'메시지를 불러오지 못했어요 ('+(err.code||err.message)+')';
  render()})}
render();
})();
